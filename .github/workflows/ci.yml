name: C++ CI

# Runs automatically whenever code is pushed or a pull request is opened.
#   Job 1  build-and-test : compile the app, run every unit + integration test
#   Job 2  quality        : code coverage (with minimum gate), end-to-end integration
#                           tests, static analysis, summary + downloadable reports
#   Job 3  release        : only for version tags, and only if jobs 1 and 2 passed
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The pipeline FAILS if line coverage drops below this percentage.
  COVERAGE_MIN_LINE: 70

jobs:
  build-and-test:
    name: Build and Test C++ Project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        run: >
          g++ -std=c++11 -Wall -Wextra
          main.cpp cli.cpp file_reader.cpp frequency.cpp
          huffman_tree.cpp encoder.cpp decoder.cpp
          -o file-compressor

      - name: Verify application build
        run: test -f file-compressor

      - name: Build CLI tests
        run: >
          g++ -std=c++11 -Wall -Wextra
          test_cli.cpp cli.cpp file_reader.cpp frequency.cpp
          huffman_tree.cpp encoder.cpp decoder.cpp
          -o test_cli

      - name: Run CLI tests
        run: ./test_cli

      - name: Build module test suites
        run: |
          g++ -std=c++11 -Wall -Wextra test_frequency.cpp frequency.cpp file_reader.cpp huffman_tree.cpp -o test_frequency
          g++ -std=c++11 -Wall -Wextra test_huffman_tree.cpp huffman_tree.cpp -o test_huffman_tree
          g++ -std=c++11 -Wall -Wextra test_encoder.cpp encoder.cpp -o test_encoder
          g++ -std=c++11 -Wall -Wextra test_decoder.cpp decoder.cpp encoder.cpp huffman_tree.cpp -o test_decoder
          g++ -std=c++11 -Wall -Wextra test_output_writer.cpp output_writer.cpp -o test_output_writer
          g++ -std=c++11 -Wall -Wextra test_decompressor.cpp decompressor.cpp encoder.cpp huffman_tree.cpp -o test_decompressor
          g++ -std=c++11 -Wall -Wextra test_reader.cpp file_reader.cpp -o test_reader
          g++ -std=c++11 -Wall -Wextra test_integration.cpp file_reader.cpp frequency.cpp huffman_tree.cpp encoder.cpp -o test_integration

      - name: Run module and integration tests
        run: |
          ./test_frequency
          ./test_huffman_tree
          ./test_encoder
          ./test_decoder
          ./test_output_writer
          ./test_decompressor
          printf 'CI integration fixture for file-reader and encoder tests.\n' > sample.txt
          trap 'rm -f sample.txt integration_test.huff' EXIT
          ./test_reader
          ./test_integration

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: file-compressor-linux
          path: file-compressor

  quality:
    name: Coverage, Integration Tests and Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy
          pip install gcovr

      - name: Code coverage (all test suites)
        run: bash quality/run_coverage.sh

      - name: End-to-end integration tests
        if: always()
        run: bash quality/run_integration_tests.sh

      - name: Static analysis (cppcheck, clang-tidy, strict g++)
        if: always()
        run: bash quality/run_static_analysis.sh

      - name: Show results on the run summary page
        if: always()
        run: bash quality/ci_summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: quality/reports/

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, quality]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: file-compressor-linux

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" file-compressor \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
