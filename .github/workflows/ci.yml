
name: C++ CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and Test C++ Project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        run: >
          g++ -std=c++11 -Wall -Wextra
          main.cpp cli.cpp file_reader.cpp frequency.cpp
          huffman_tree.cpp encoder.cpp decoder.cpp
          -o file-compressor

      - name: Verify application build
        run: test -f file-compressor

      - name: Build CLI tests
        run: >
          g++ -std=c++11 -Wall -Wextra
          test_cli.cpp cli.cpp file_reader.cpp frequency.cpp
          huffman_tree.cpp encoder.cpp decoder.cpp
          -o test_cli

      - name: Run CLI tests
        run: ./test_cli

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: file-compressor-linux
          path: file-compressor

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" file-compressor \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

